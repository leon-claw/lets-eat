services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lets_eat}
      POSTGRES_USER: ${POSTGRES_USER:-lets_eat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lets_eat_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lets_eat} -d ${POSTGRES_DB:-lets_eat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: lets_eat_test
      POSTGRES_USER: lets_eat_test
      POSTGRES_PASSWORD: lets_eat_test
    ports:
      - "55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lets_eat_test -d lets_eat_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [latency]
    ports:
      - "3002:8666"
      - "127.0.0.1:8474:8474"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  postgres-test-data:
